<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Network Defender: Firewall Defense</title>
    <style>
        body {
            margin: 0;
            background-color: #0d1117;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 500px;
            height: 700px;
            border: 4px solid #30363d;
            background: linear-gradient(to bottom, #161b22, #0d1117);
            border-radius: 10px;
        }

        canvas { display: block; }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(13, 17, 23, 0.95);
            z-index: 100; text-align: center;
        }

        .active { display: flex; }

        .card {
            background: #1c2128;
            padding: 25px;
            border: 2px solid #58a6ff;
            border-radius: 15px;
            width: 85%;
        }

        .opt-btn {
            display: block; width: 100%; margin: 10px 0;
            padding: 12px; background: #21262d;
            border: 1px solid #30363d; color: #58a6ff;
            border-radius: 8px; cursor: pointer;
        }

        .opt-btn:hover { background: #58a6ff; color: white; }

        #ui-layer {
            position: absolute;
            top: 10px; left: 10px;
            pointer-events: none;
        }

        .controls-hint {
            position: absolute;
            bottom: 10px; width: 100%;
            text-align: center; color: #8b949e; font-size: 12px;
        }

        .color-indicator {
            display: inline-block; width: 20px; height: 20px; border-radius: 50%;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div>SKOR: <span id="score">0</span></div>
        <div>SISTEM DURUMU: <span id="status" style="color:#238636">GÜVENLİ</span></div>
    </div>

    <div id="start-screen" class="overlay active">
        <div class="card">
            <h1 style="color:#58a6ff">Firewall Defense</h1>
            <p>Yukarıdan gelen veri paketlerini uygun renkteki kalkanla durdur!</p>
            <p style="font-size: 14px; color: #8b949e;">
                [1] - <span style="color:#e94560">KIRMIZI</span><br>
                [2] - <span style="color:#4ecca3">YEŞİL</span><br>
                [3] - <span style="color:#58a6ff">MAVİ</span>
            </p>
            <button onclick="startGame()" style="padding:15px 30px; background:#238636; color:white; border:none; border-radius:5px; cursor:pointer;">SİSTEMİ BAŞLAT</button>
        </div>
    </div>

    <div id="question-screen" class="overlay">
        <div class="card" style="border-color: #f0883e;">
            <h2 style="color:#f0883e;">Sistem Analizi Gerekiyor</h2>
            <p id="question-text"></p>
            <div id="options"></div>
        </div>
    </div>

    <div id="game-over-screen" class="overlay">
        <div class="card" style="border-color: #f85149;">
            <h2 style="color:#f85149;">SİSTEM ÇÖKTÜ</h2>
            <p id="fail-msg"></p>
            <button onclick="location.reload()" style="padding:10px 20px; background:#f85149; border:none; color:white; border-radius:5px;">YENİDEN BAŞLAT</button>
        </div>
    </div>

    <div class="controls-hint">Tuşlar: 1, 2, 3 veya Ekrana Tıkla</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 500;
    canvas.height = 700;

    let score = 0;
    let packets = [];
    let gameRunning = false;
    let activeColor = "#e94560"; // Varsayılan Kırmızı
    let frame = 0;
    const colors = ["#e94560", "#4ecca3", "#58a6ff"];

    const questions = [
        { q: "Hangi protokol daha güvenlidir?", a: ["HTTP", "HTTPS", "FTP", "Telnet"], c: 1 },
        { q: "Güvenlik Duvarı (Firewall) hangi katmanda paket filtreleme yapar?", a: ["Fiziksel", "Ağ (Network)", "Sunum", "Oturum"], c: 1 },
        { q: "Zararlı yazılımları temizleyen programa ne denir?", a: ["Antivirüs", "Router", "Browser", "Excel"], c: 0 },
        { q: "Karmaşık şifrelerin amacı nedir?", a: ["Brute Force saldırısını zorlaştırmak", "Hızlı internet", "Daha az CPU kullanımı", "IP gizlemek"], c: 0 },
        { q: "DNS ne işe yarar?", a: ["Dosya indirir", "İsimleri IP'ye çevirir", "Virüs siler", "Ekran kartını soğutur"], c: 1 }
    ];

    function startGame() {
        document.getElementById('start-screen').classList.remove('active');
        gameRunning = true;
        animate();
    }

    function spawnPacket() {
        const laneWidth = canvas.width / 3;
        const lane = Math.floor(Math.random() * 3);
        packets.push({
            x: lane * laneWidth + laneWidth/2,
            y: -20,
            color: colors[Math.floor(Math.random() * 3)],
            speed: 2 + (score * 0.1)
        });
    }

    function askQuestion() {
        gameRunning = false;
        const screen = document.getElementById('question-screen');
        const q = questions[Math.floor(Math.random() * questions.length)];
        document.getElementById('question-text').innerText = q.q;
        const optDiv = document.getElementById('options');
        optDiv.innerHTML = '';

        q.a.forEach((opt, idx) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = opt;
            b.onclick = () => {
                if(idx === q.c) {
                    screen.classList.remove('active');
                    gameRunning = true;
                    packets = []; // Ekranı temizle
                    animate();
                } else {
                    endGame("Yanlış cevap! Sistem sızma tespit etti.");
                }
            };
            optDiv.appendChild(b);
        });
        screen.classList.add('active');
    }

    function endGame(msg) {
        gameRunning = false;
        document.getElementById('game-over-screen').classList.add('active');
        document.getElementById('fail-msg').innerText = msg;
    }

    function update() {
        if(!gameRunning) return;

        frame++;
        if(frame % 80 === 0) spawnPacket();

        packets.forEach((p, i) => {
            p.y += p.speed;

            // Kalkan çizgisine ulaştı mı? (y = 600 civarı)
            if(p.y > 580 && p.y < 610) {
                if(p.color === activeColor) {
                    packets.splice(i, 1);
                    score++;
                    document.getElementById('score').innerText = score;
                    if(score > 0 && score % 5 === 0) askQuestion();
                }
            }

            // Kaçırılan paket
            if(p.y > canvas.height) {
                endGame("Bir paket savunmayı geçti!");
            }
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Kalkan (Firewall Line)
        ctx.beginPath();
        ctx.strokeStyle = activeColor;
        ctx.lineWidth = 8;
        ctx.moveTo(0, 600);
        ctx.lineTo(canvas.width, 600);
        ctx.stroke();
        
        // Kalkan Işıması
        ctx.globalAlpha = 0.2;
        ctx.fillStyle = activeColor;
        ctx.fillRect(0, 595, canvas.width, 10);
        ctx.globalAlpha = 1.0;

        // Paketler
        packets.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 15, 0, Math.PI*2);
            ctx.fill();
            // Gölge/Işıma
            ctx.shadowBlur = 10;
            ctx.shadowColor = p.color;
        });
        ctx.shadowBlur = 0;
    }

    function animate() {
        if(!gameRunning) return;
        update();
        draw();
        requestAnimationFrame(animate);
    }

    // Kontroller
    window.addEventListener('keydown', (e) => {
        if(e.key === "1") activeColor = colors[0];
        if(e.key === "2") activeColor = colors[1];
        if(e.key === "3") activeColor = colors[2];
    });

    // Mouse ile kontrol (dokunmatik uyumlu)
    canvas.addEventListener('mousedown', (e) => {
        const x = e.offsetX;
        if(x < canvas.width / 3) activeColor = colors[0];
        else if(x < (canvas.width / 3) * 2) activeColor = colors[1];
        else activeColor = colors[2];
    });

</script>
</body>
</html>
