<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobil Not Defteri</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f2f2f2;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .app{
        width:100%;
        max-width:400px;
        height:100vh;
        background:white;
        display:flex;
        flex-direction:column;
    }

    .header{
        background:#4a90e2;
        color:white;
        padding:20px;
        text-align:center;
        font-size:24px;
        font-weight:bold;
    }

    .input-area{
        display:flex;
        padding:10px;
        gap:10px;
    }

    .input-area input{
        flex:1;
        padding:12px;
        border:1px solid #ccc;
        border-radius:10px;
        font-size:16px;
    }

    .input-area button{
        padding:12px 16px;
        border:none;
        background:#4a90e2;
        color:white;
        border-radius:10px;
        font-size:16px;
        cursor:pointer;
    }

    .notes{
        flex:1;
        overflow-y:auto;
        padding:10px;
    }

    .note{
        background:#f7f7f7;
        padding:15px;
        border-radius:12px;
        margin-bottom:10px;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }

    .delete-btn{
        background:red;
        color:white;
        border:none;
        padding:8px 12px;
        border-radius:8px;
        cursor:pointer;
    }
</style>
</head>

<body>

<div class="app">

    <div class="header">
        Not Defteri
    </div>

    <div class="input-area">
        <input type="text" id="noteInput" placeholder="Not yaz...">
        <button onclick="addNote()">Ekle</button>
    </div>

    <div class="notes" id="notes"></div>

</div>

<script>

let notes = JSON.parse(localStorage.getItem("notes")) || [];

function renderNotes(){
    const notesDiv = document.getElementById("notes");
    notesDiv.innerHTML = "";

    notes.forEach((note,index)=>{
        notesDiv.innerHTML += `
            <div class="note">
                <span>${note}</span>
                <button class="delete-btn" onclick="deleteNote(${index})">Sil</button>
            </div>
        `;
    });
}

function addNote(){
    const input = document.getElementById("noteInput");
    const text = input.value.trim();

    if(text !== ""){
        notes.push(text);
        localStorage.setItem("notes", JSON.stringify(notes));
        input.value = "";
        renderNotes();
    }
}

function deleteNote(index){
    notes.splice(index,1);
    localStorage.setItem("notes", JSON.stringify(notes));
    renderNotes();
}

renderNotes();

</script>

</body>
</html>
